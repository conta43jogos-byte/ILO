<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coração para Andressa</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
<style>
/* === ANIMAÇÃO DO CORAÇÃO + LOVE === */
#love-heart-animation {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 9999;
  background: transparent;
}
.love-particle {
  position: absolute;
  left: 50%;
  top: 100%;
  font: 800 12px/1 Arial, sans-serif;
  color: #ff4fd8;
  text-shadow: 0 0 6px #ff4fd8, 0 0 18px #ff1493;
  transform: translate(-50%, 0);
  animation: loveSubir 3.4s cubic-bezier(.2,.75,.25,1) forwards;
}
@keyframes loveSubir {
  0% { opacity: 0; transform: translate(-50%, 0) scale(.5) rotate(0deg); }
  12% { opacity: 1; }
  100% { opacity: 1; transform: translate(calc(-50% + var(--x)), var(--y)) scale(1.05) rotate(var(--r)); }
}
#love-heart {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(58vw, 360px);
  height: min(52vw, 330px);
  transform: translate(-50%, -50%);
  animation: heartFloat 1.8s ease-in-out infinite;
  filter: drop-shadow(0 0 12px rgba(255,20,147,.85)) drop-shadow(0 0 28px rgba(255,20,147,.45));
}
#love-heart::before {
  content: "♥";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #ff2bb5;
  font: 900 min(50vw, 310px)/1 Arial, sans-serif;
  text-shadow: 0 0 8px #ff7be2, 0 0 25px #ff1493, 0 0 55px rgba(255,20,147,.8);
  animation: heartPulse .95s ease-in-out infinite;
}
@keyframes heartFloat {
  0%,100% { margin-top: 0; margin-left: 0; }
  50% { margin-top: -10px; margin-left: 7px; }
}
@keyframes heartPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.075); }
}
#love-heart-text {
  position: absolute;
  left: 50%;
  top: 53%;
  transform: translate(-50%, -50%);
  z-index: 2;
  color: white;
  font: 800 clamp(18px, 4vw, 30px)/1.2 Arial, sans-serif;
  text-align: center;
  text-shadow: 0 0 8px white, 0 0 20px #ff1493;
  white-space: nowrap;
}
</style>
</head>
<body>

    <canvas id="coracaoCanvas"></canvas>

    <script>
        const canvas = document.getElementById("coracaoCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function desenhar() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const largura = canvas.width;
            const altura = canvas.height;
            const escala = Math.min(largura, altura) / 35;

            const cx = largura / 2;
            const cy = altura / 2 + 10;

            let step = 0.1;
            for (let k = 0; k < Math.PI * 2; k += step) {
                let x = 16 * Math.pow(Math.sin(k), 3);
                let y = -(13 * Math.cos(k) - 5 * Math.cos(2 * k) - 2 * Math.cos(3 * k) - Math.cos(4 * k));

                let posX = cx + x * escala;
                let posY = cy + y * escala;

                let r = Math.floor(120 + Math.random() * 100);
                let g = Math.floor(20 + Math.random() * 40);
                let b = Math.floor(180 + Math.random() * 75);

                ctx.save();
                ctx.translate(posX, posY);

                ctx.shadowBlur = 10;
                ctx.shadowColor = `rgb(${r}, ${g}, ${b})`;

                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.font = "bold 12px Consolas, monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("Love you", 0, 0);
                ctx.restore();
            }

            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = "white";
            ctx.fillStyle = "white";
            ctx.font = "bold 26px Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            let texto = "Te amo\nAndressa!";
            let linhas = texto.split("\n");
            for (let i = 0; i < linhas.length; i++) {
                ctx.fillText(linhas[i], cx, cy + (i * 32) - 15);
            }
            ctx.restore();
        }

        desenhar();

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            desenhar();
        });
    </script>

<script>
(() => {
  const root = document.createElement('div');
  root.id = 'love-heart-animation';
  root.innerHTML = '<div id="love-heart"></div><div id="love-heart-text">Te amo<br>Andressa!</div>';
  document.body.appendChild(root);

  const heartPoint = (t, scale) => ({
    x: 16 * Math.pow(Math.sin(t), 3) * scale,
    y: -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * scale
  });

  function createLove() {
    const p = document.createElement('span');
    p.className = 'love-particle';
    p.textContent = 'LOVE';

    const scale = Math.min(innerWidth, innerHeight) / 42;
    const t = Math.random() * Math.PI * 2;
    const pt = heartPoint(t, scale);
    const spread = 0.82 + Math.random() * 0.35;

    p.style.setProperty('--x', `${pt.x * spread}px`);
    p.style.setProperty('--y', `${pt.y * spread - innerHeight * 0.5}px`);
    p.style.setProperty('--r', `${(Math.random()-.5)*45}deg`);
    p.style.animationDelay = `${Math.random() * 2.2}s`;

    root.appendChild(p);
    setTimeout(() => p.remove(), 6500);
  }

  // Continuous flow: LOVE starts from below and draws the heart.
  setInterval(createLove, 45);
  for (let i = 0; i < 55; i++) setTimeout(createLove, i * 35);
})();
</script>

</body>
</html>
